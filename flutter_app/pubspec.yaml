name: sit_app
description: "Finansal Asistanınız."
publish_to: 'none' 

version: 1.0.0+2

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Bu dependency'i flutter'ın altına taşımak daha standart bir yaklaşımdır.
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2 # Intl paketinin daha güncel bir versiyonu kullanılabilir, 0.18.1 yaygın bir versiyondur.
  http: ^1.2.1
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.10+1 # SVG desteği için
  fl_chart: ^0.68.0 # Grafik kütüphanesi
  logger: ^2.3.0
  collection: ^1.18.0
  change_app_package_name: ^1.5.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0

  # --- YENİ EKLENEN DEV_DEPENDENCY ---
  # Bu paket sadece geliştirme aşamasında ikon oluşturmak için kullanılır.
  flutter_launcher_icons: ^0.13.1

# --- YENİ EKLENEN İKON YAPILANDIRMASI ---
# Bu bölüm, flutter_launcher_icons paketinin nasıl çalışacağını belirler.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/sit_app_logo.png" # Ana ikon dosyanızın yolu
  min_sdk_android: 21 # Adaptive ikonlar için gereklidir

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icon/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf